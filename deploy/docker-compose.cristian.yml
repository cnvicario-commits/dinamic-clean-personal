# Cristian demo API. Independent Compose project. Do not point this file at
# /opt/dinamic-clean or at a production env file.
# Rendering this file is not a deploy check. Recreate the container only
# through scripts/redeploy-cristian-api.sh, which runs the CA preflight first.
#
# CPU, memory, and the host port have no defaults. Set them from the VPS
# survey before the first start. The port is published on 0.0.0.0 because
# 170.239.85.196 was not verified as an address on a local interface. NAT
# often has no such address on the host. Check the host firewall before
# treating this publication as restricted. Do not bind that public IP here.

name: dinamic-clean-cristian

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        APP_RELEASE_SHA: ${APP_RELEASE_SHA:?set the deployed git sha}
    image: dinamic-clean-api:${APP_RELEASE_SHA:?set the deployed git sha}
    container_name: dinamic-clean-cristian-api
    user: "10001:10001"
    init: true
    env_file:
      - ${CRISTIAN_ENV_FILE:?set the cristian env file, never the production env}
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_ENV: production
      APP_DEPLOYMENT_ENV: cristian-pruebas
      EXPECTED_SUPABASE_PROJECT_REF: edruejzwwnixsjsadbgb
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:?set the deployed git sha}
      MIGRATIONS_DATABASE_URL: ""
      TRUST_PROXY_CIDRS: ${CRISTIAN_TRUST_PROXY_CIDRS:-127.0.0.1}
      # Node loads this CA at process start. Verification stays enabled.
      NODE_EXTRA_CA_CERTS: /app/certs/supabase-ca.crt
    volumes:
      - type: bind
        source: ${CRISTIAN_SUPABASE_CA_FILE:?set the host path of the Supabase CA file}
        target: /app/certs/supabase-ca.crt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "0.0.0.0:${CRISTIAN_API_HOST_PORT:?set 3006 for the Cristian HTTP publication}:3001"
    networks:
      - cristian
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${CRISTIAN_API_MEMORY:?set from measured VPS capacity}
    cpus: ${CRISTIAN_API_CPUS:?set from measured VPS capacity}
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  cristian:
    name: dinamic-clean-cristian
    driver: bridge
