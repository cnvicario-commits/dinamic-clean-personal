# Dinamic Clean API — local / staging compose (not production k8s)
#
# Usage:
#   cp apps/api/.env.example apps/api/.env   # fill secrets locally — never commit
#   docker compose -f deploy/docker-compose.api.yml --env-file apps/api/.env up --build
#
# Secrets: mount or pass via --env-file / env_file. Do not bake credentials into the image.

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: dinamic-clean-api:local
    ports:
      - "${API_HOST_PORT:-3001}:3001"
    env_file:
      - ../apps/api/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
