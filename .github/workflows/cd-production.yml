name: cd-production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-production to continue
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and an explicit confirmation
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
          ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "PRODUCTION_REF_REJECTED"
            exit 1
          fi
          if [[ "$CONFIRM" != "deploy-production" ]]; then
            echo "PRODUCTION_CONFIRMATION_REJECTED"
            exit 1
          fi
          if [[ "$ENABLED" != "true" ]]; then
            echo "PRODUCTION_DEPLOY_DISABLED"
            exit 1
          fi

  publish:
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Publish production API image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$owner" --password-stdin
          image="ghcr.io/${owner}/dinamic-clean-api:production-${GITHUB_SHA}"
          docker build -f apps/api/Dockerfile --build-arg "APP_RELEASE_SHA=${GITHUB_SHA}" -t "$image" apps/api
          docker push "$image"
          echo "CD_PRODUCTION_PUBLISHED ${GITHUB_SHA}"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy production API
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_KEY" || -z "$KNOWN_HOSTS" || -z "$HOST" || -z "$USER_NAME" ]]; then
            echo "PRODUCTION_DEPLOY_NOT_CONFIGURED"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${USER_NAME}@${HOST}" "production-apply ${GITHUB_SHA}"
          echo "CD_PRODUCTION_DEPLOY_REQUESTED ${GITHUB_SHA}"
