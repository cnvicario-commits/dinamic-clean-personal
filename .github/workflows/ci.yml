name: ci

on:
  push:
    branches: [main, master, cristian-pruebas]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - name: audit
        run: PYTHONPATH=scripts/audit python3 scripts/audit/check_frontend_npm_audit_gate.py
      - name: Secret scan (basic)
        run: |
          if rg -n "SUPABASE_SERVICE_ROLE_KEY\s*=\s*['\"]?eyJ|sb_secret_|service_role" --glob '!**/.env*' --glob '!**/node_modules/**' --glob '!**/*.lock' . ; then
            echo "Possible secret material in tracked files"
            exit 1
          fi
          echo "basic secret scan ok"

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - name: audit
        run: npm audit --audit-level=critical

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci --prefix apps/api
      - name: local supabase integration
        run: ./scripts/run-ephemeral-integration.sh

  deploy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: workflow isolation
        run: node scripts/ci/check-workflow-isolation.mjs
      - name: migration files
        run: node scripts/ci/check-forward-migration-files.mjs
      - name: Cristian compose syntax
        run: |
          ./scripts/check-cristian-compose.sh
          ./scripts/check-cristian-frontend-compose.sh
